[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-guard-demo"
version = "0.1.0"
description = "FastAPI + LLM Guard demo with a plain HTML frontend."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
  "sqlalchemy>=2.0.30,<3.0.0",
  "alembic>=1.13.2,<2.0.0",
  "psycopg[binary]>=3.2.1,<4.0.0",
  "pydantic-settings>=2.3.0,<3.0.0",
  "passlib[bcrypt]>=1.7.4,<2.0.0",
  "PyJWT>=2.8.0,<3.0.0",
  "openai>=1.35.0,<2.0.0",
  "tiktoken>=0.7.0,<1.0.0",
  "python-multipart>=0.0.9,<1.0.0",
  "llm-guard>=0.3.15,<1.0.0",
  "pillow>=10.4.0,<12.0.0",
  "python-docx>=1.1.2,<2.0.0",
  "openpyxl>=3.1.5,<4.0.0",
  "python-pptx>=1.0.2,<2.0.0",
  "pymupdf>=1.24.10,<2.0.0",
  "paddlepaddle==2.6.2",
  "paddleocr==2.8.1",
  "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
  "zh-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/zh_core_web_sm-3.8.0/zh_core_web_sm-3.8.0-py3-none-any.whl",
  "python-dotenv>=1.0.1,<2.0.0",
  "optimum[onnxruntime]>=2.1.0",
  "accelerate>=1.0.0,<2.0.0",
  "opf @ git+https://github.com/openai/privacy-filter.git",
]

[dependency-groups]
dev = [
  "httpx>=0.27.0,<1.0.0",
  "pytest>=8.2.0,<9.0.0",
  "pytest-asyncio>=0.23.0,<1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
